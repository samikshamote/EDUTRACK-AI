<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Smart Attendance{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</head>

<body>

<div class="layout">

    <aside class="sidebar">

    <div class="college-brand">
        <img src="{% static 'images/kaveri_logo.png' %}" alt="College Logo">
        <h2>Kaveri College</h2>
        <p>Arts, Science & Commerce<br>Pune</p>
    </div>

    <ul class="menu">
        <li><a href="/students/dashboard/">Student Dashboard</a></li>
        <li><a href="/teachers/dashboard/">Teacher Dashboard</a></li>
        <li><a href="/teachers/dashboard/">Attendance</a></li>
        <li><a href="/accounts/logout/">Logout</a></li>
    </ul>

</aside>


    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <h3>{% block header %}{% endblock %}</h3>
        </header>

        <section class="content">
            {% block content %}{% endblock %}
        </section>
    </main>

</div>

</body>
</html>
