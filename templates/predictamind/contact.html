<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PredictaMind</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            <a href="{{ url_for('index') }}" style="text-decoration: none; color: inherit;">
                <i class="fa-solid fa-flask"></i> PredictaMind
            </a>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('features') }}">Features</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('contact') }}" style="color: var(--primary-blue);">Contact</a>
            <a href="{{ url_for('login') }}" class="btn-primary">Login</a>
        </div>
    </nav>

    <div class="container" style="margin-top: 4rem; max-width: 600px;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Contact Us</h1>

        <div style="text-align: center; margin-bottom: 2rem; color: var(--text-light);">
            <p>Have questions or feedback? We'd love to hear from you!</p>
        </div>

        <form action="#" style="background: var(--white);">
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="text" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="Your Message"
                    style="width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 0.5rem; font-family: inherit; font-size: 1rem;"></textarea>
            </div>

            <button type="submit" class="btn-primary block">Send Message</button>
        </form>

        <div style="margin-top: 3rem; text-align: center;">
            <p><i class="fa-solid fa-envelope"></i> support@predictamind.com</p>
            <p><i class="fa-solid fa-phone"></i> +1 (555) 123-4567</p>
        </div>
    </div>

</body>

</html>
