{% extends "base.html" %}
{% load static %}

{% block content %}
<h2>Welcome {{ request.user.username }}</h2>

<div class="cards">
    <div class="card">
        <h3>Total Lectures</h3>
        <p>{{ total }}</p>
    </div>

    <div class="card">
        <h3>Present</h3>
        <p>{{ present }}</p>
    </div>

    <div class="card">
        <h3>Attendance %</h3>
        <p>{{ percentage }}%</p>
    </div>
</div>
{% endblock %}
