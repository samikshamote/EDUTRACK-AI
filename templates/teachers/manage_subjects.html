{% extends 'base.html' %}
{% block title %}Manage Subjects{% endblock %}

{% block content %}
<h2>Manage Subjects</h2>

<div style="display:flex; gap:40px; margin-top:20px;">

    <!-- Add Subject Form -->
    <div style="flex:1;">
        <h3>Add New Subject</h3>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="padding:8px 15px;">
                Add Subject
            </button>
        </form>
    </div>

    <!-- Subject List -->
    <div style="flex:1;">
        <h3>Your Subjects</h3>

        <table border="1" cellpadding="8" width="100%">
            <tr>
                <th>Name</th>
            </tr>

            {% for subject in subjects %}
            <tr>
                <td>{{ subject.name }}</td>
            </tr>
            {% empty %}
            <tr>
                <td>No subjects added yet</td>
            </tr>
            {% endfor %}

        </table>
    </div>

</div>

{% endblock %}
