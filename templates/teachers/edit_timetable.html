{% extends "base.html" %}
{% block content %}

<div style="background:white; padding:25px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.08);">

<h2>Edit Timetable Entry</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background:#2563eb; color:white; padding:8px 15px; border:none; border-radius:6px;">
        Update
    </button>
</form>

</div>

{% endblock %}
