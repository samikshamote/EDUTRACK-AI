<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Smart Attendance</title>

    {% load static %}
    <base href="/">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e0e7ff, #f8fafc);
}

.login-box {
    background: #ffffff;
    width: 420px;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.15);
    text-align: center;
}

.college-logo {
    width: 70px;
    margin-bottom: 12px;
}

.college-name {
    font-size: 18px;
    font-weight: 700;
    color: #1e40af;
}

.college-sub {
    font-size: 13px;
    color: #64748b;
    margin-bottom: 25px;
}

h2 {
    margin-bottom: 22px;
    color: #0f172a;
}

.form-group {
    text-align: left;
    margin-bottom: 16px;
}

label {
    font-weight: 600;
    font-size: 13px;
    color: #334155;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border-radius: 8px;
    border: 1px solid #cbd5f5;
    background: #f8fafc;
}

input:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
}

.login-btn {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.login-btn:hover {
    background: #1e40af;
}

.error {
    color: #dc2626;
    margin-bottom: 10px;
    font-size: 14px;
}

.footer-text {
    margin-top: 22px;
    font-size: 12px;
    color: #64748b;
}
</style>

</head>

<body>

<div class="login-box">

    <img src="{% static 'images/kaveri_logo.png' %}" class="college-logo" alt="College Logo">

    <div class="college-name">
        Kaveri College of Arts, Science & Commerce
    </div>
    <div class="college-sub">
        Pune · Smart Attendance System
    </div>

    <h2><i class="fa-solid fa-user-lock"></i> Login</h2>

    {% if form.errors %}
        <p class="error">Invalid username or password</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="login-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
    </form>

    <div class="footer-text">
        © 2026 Kaveri College | Final Year Project
    </div>

</div>

</body>
</html>
