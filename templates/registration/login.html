<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Smart Attendance</title>

    {% load static %}

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1d2671, #c33764);
        }

        .login-box {
            background: #ffffff;
            width: 380px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        .college-logo {
            width: 65px;
            margin-bottom: 10px;
        }

        .college-name {
            font-size: 18px;
            font-weight: 700;
            color: #1d2671;
        }

        .college-sub {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: none;
            border-color: #c33764;
        }

        .login-btn {
            width: 100%;
            margin-top: 10px;
            padding: 11px;
            background: #c33764;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #a12b52;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        .footer-text {
            margin-top: 18px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="login-box">

    <img src="{% static 'images/kaveri_logo.png' %}" class="college-logo" alt="College Logo">

    <div class="college-name">
        Kaveri College of Arts, Science & Commerce
    </div>
    <div class="college-sub">
        Pune · Smart Attendance System
    </div>

    <h2><i class="fa-solid fa-user-lock"></i> Login</h2>

    {% if form.errors %}
        <p class="error">Invalid username or password</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label>Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="login-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
    </form>

    <div class="footer-text">
        © 2026 Kaveri College | Final Year Project
    </div>

</div>

</body>
</html>
